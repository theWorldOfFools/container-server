# Container Server — contoh vhost snippet
# Letakkan di dalam <VirtualHost *:80> yang DocumentRoot-nya /var/www/html,
# atau include sebagai conf terpisah. Butuh: a2enmod proxy proxy_http proxy_wstunnel rewrite

# WebSocket terminal (Node :6789). Path ini dipakai frontend sebagai WS_URL + "/?token=..."
ProxyPreserveHost On
ProxyPass /container-server-ws/ ws://127.0.0.1:6789/ retry=0 timeout=3600
ProxyPassReverse /container-server-ws/ ws://127.0.0.1:6789/
# Naikkan timeout khusus WS agar terminal tidak diputus proxy saat idle
# (ProxyTimeout hanya valid di konteks server/vhost, bukan di dalam <Location>)
ProxyTimeout 3600
<Location /container-server-ws/>
  Require all granted
</Location>
